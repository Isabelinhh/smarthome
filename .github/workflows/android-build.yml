name: Construir APK Android (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK de Depuracao (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Dependencias
        run: npm install

      - name: Adicionar plataforma Android se necessario
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Gerar recursos visuais Android
        run: npx capacitor-assets generate --android

      - name: Gerar aplicacao Web
        run: npm run build

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Permissao de Execucao do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK com Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
